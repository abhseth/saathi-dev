app = "saathi"
primary_region = "bom"

[build]

[env]
  PORT = "3000"
  DATABASE_PATH = "/data/tickets.sqlite3"

[[mounts]]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
